[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-stock-analysts-roundtable"
version = "0.2.0"
description = "Multi-model investment roundtable agent for equity analysis reports"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AIStockAnalystsRoundtable" }]
dependencies = [
  "gradio>=4.0.0",
  "pypdf>=4.0.0",
  "python-docx>=1.1.0",
  "python-pptx>=0.6.23",
  "pandas>=2.0.0",
  "openpyxl>=3.1.0",
  "pillow>=10.0.0",
  "pytesseract>=0.3.10",
]

[project.scripts]
roundtable-agent = "roundtable_agent.cli:main"
roundtable-agent-web = "roundtable_agent.webapp:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
